name: ci
on: [push, pull_request]

jobs:
  # Regenerate the OCaml from the Lean spec and fail if gen/ differs.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain comes from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: scripts/check-gen.sh

  # Everything: proofs, proof gate, generator rejection tests, drift, OCaml build, difftest.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain comes from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
      - run: opam install -y dune alcotest
      - run: opam exec -- scripts/verify.sh
